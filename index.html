<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MI-RETRIEVE-CODE — save your information and retrieve it with a unique code.">
  <title>MI-RETRIEVE-CODE</title>
  <style>
:root{color-scheme:light;--navy:#14243a;--blue:#3976c5;--blue-dark:#285fa6;--ink:#26364a;--muted:#68788e;--line:#e1e8f0;--bg:#f3f6fa;--white:#fff;--green:#087443;--red:#b42318}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;padding:30px 28px 30px 278px;background:linear-gradient(135deg,#f4f7fb,#edf2f8);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.sidebar{position:fixed;inset:0 auto 0 0;width:250px;padding:28px 18px;background:linear-gradient(180deg,#14243a,#1b3049);color:#fff;display:flex;flex-direction:column;gap:24px;box-shadow:8px 0 28px rgba(20,36,58,.12);z-index:10}
.brand{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.13)}.brand strong{display:block;font-size:1.04rem;letter-spacing:.025em}.brand span{display:block;margin-top:7px;color:#bdcadd;font-size:.78rem;line-height:1.5}
.nav-label{padding:0 10px;color:#9fb0c5;font-size:.7rem;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.side-nav{display:grid;gap:7px}
.side-nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:#dce6f2;text-decoration:none;font-size:.91rem;font-weight:550;transition:background .18s,color .18s,transform .18s}
.side-nav a:hover,.side-nav a:focus-visible{color:#fff;background:rgba(255,255,255,.13);transform:translateX(2px);outline:none}.side-nav a.active{color:#fff;background:var(--blue);box-shadow:0 5px 14px rgba(0,0,0,.16)}.nav-icon{width:20px;text-align:center}
.sidebar-note{margin-top:auto;padding:13px;border:1px solid rgba(255,255,255,.13);border-radius:12px;color:#c3d0df;font-size:.77rem;line-height:1.55}
.container{max-width:1080px;margin:0 auto}header{text-align:left;margin:4px 0 25px;padding:6px 2px 18px;border-bottom:1px solid var(--line)}
h1{margin:0;color:var(--navy);font-size:clamp(1.8rem,4vw,2.35rem);letter-spacing:-.045em}.tagline{color:var(--muted);margin:8px 0 0;font-size:1rem}
.card{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:25px;margin:18px 0;box-shadow:0 8px 28px rgba(31,52,78,.055);transition:box-shadow .2s,border-color .2s}.card:hover{box-shadow:0 12px 32px rgba(31,52,78,.085);border-color:#d4deea}
h2{margin:0 0 14px;color:var(--navy);font-size:1.22rem;letter-spacing:-.015em}h3,h4{color:var(--navy)}
label{display:block;margin:14px 0 7px;font-weight:650;font-size:.91rem;color:#35465d}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid #d4deea;border-radius:10px;font:inherit;background:#fff;color:var(--ink);transition:border-color .18s,box-shadow .18s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(57,118,197,.13)}textarea{min-height:140px;resize:vertical;line-height:1.6}
button{border:0;border-radius:10px;padding:11px 17px;margin:12px 8px 0 0;background:var(--blue);color:white;font:inherit;font-weight:650;cursor:pointer;box-shadow:0 3px 8px rgba(57,118,197,.13);transition:background .18s,transform .18s,box-shadow .18s}
button:hover{background:var(--blue-dark);transform:translateY(-1px);box-shadow:0 6px 14px rgba(57,118,197,.2)}button:focus-visible{outline:3px solid rgba(57,118,197,.28);outline-offset:2px}button:disabled{opacity:.6;cursor:wait;transform:none}
button.secondary{background:#eaf0f7;color:#294766;box-shadow:none}button.secondary:hover{background:#dce7f3}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row button{margin-right:0}
.status,.result,.notice{padding:14px 16px;border-radius:11px;margin-top:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.status{background:#edf3fb;color:#294766;border:1px solid #e0e9f4}.status.success{background:#eaf7ef;color:var(--green);border-color:#d6eddf}.status.error{background:#fff0ef;color:var(--red);border-color:#f7d9d6}
.result{background:#f7f9fc;border:1px solid var(--line);min-height:48px;line-height:1.6}.notice{background:#fff8e9;color:#76520b;border:1px solid #f2e6c8;font-size:.9rem;line-height:1.55}
.small{color:var(--muted);font-size:.88rem;line-height:1.6}.hidden{display:none!important}.account-line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}.code{font-weight:800;letter-spacing:.055em;color:var(--blue-dark);font-size:1.04rem}
a:not(.side-nav a){color:var(--blue-dark);font-weight:600;text-decoration:none;text-underline-offset:3px}a:not(.side-nav a):hover{color:#174b8b;text-decoration:underline}a:focus-visible{outline:3px solid rgba(57,118,197,.25);outline-offset:3px;border-radius:4px}
footer{text-align:left;color:var(--muted);font-size:.82rem;padding:18px 2px 28px}

/* Consistent larger fields across the entire MI-RETRIEVE-CODE website */
body input:not([type="file"]),
body textarea,
body select{
  min-height:56px;
  padding:15px 17px;
  font-size:1rem;
  border-radius:12px;
}
body textarea{
  min-height:220px;
  line-height:1.65;
}
@media(max-width:760px){
  body input:not([type="file"]),
  body textarea,
  body select{
    min-height:52px;
    padding:13px 14px;
    font-size:1rem;
  }
  body textarea{min-height:190px}
}

/* Larger ChatGPT-style Student Access workspace */
body.student-chat-mode #studentRetrieveArea:not(.page-hidden){min-height:0}
body.student-chat-mode .student-chat-messages{
  flex:1 1 0;min-height:min(60vh,680px);padding:22px;
}
body.student-chat-mode .student-chat-code-row input{
  min-height:58px;padding:16px 18px;font-size:1.02rem;border-radius:14px;
}
body.student-chat-mode .student-chat-code-row button{
  min-height:58px;padding:0 24px;border-radius:14px;font-size:1rem;
}
.notice{
  white-space:nowrap;overflow-x:auto;overflow-y:hidden;
  padding:10px 14px;font-size:.78rem;line-height:1.35;
  scrollbar-width:thin;
}
@media(max-width:760px){
  body.student-chat-mode .student-chat-messages{min-height:42vh;padding:15px}
  body.student-chat-mode .student-chat-code-row input{min-height:52px;padding:12px 10px;font-size:.9rem}
  body.student-chat-mode .student-chat-code-row button{min-height:52px;padding:0 14px}
  .notice{font-size:.72rem}
}

@media(max-width:760px){body{padding:0 14px 22px}.sidebar{position:relative;inset:auto;width:auto;margin:0 -14px 22px;padding:15px 14px 12px;gap:12px;box-shadow:0 5px 18px rgba(20,36,58,.12)}.brand{padding:2px 6px 10px}.brand strong{font-size:.98rem}.brand span,.sidebar-note,.nav-label{display:none}.side-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}.side-nav a{flex:0 0 auto;padding:9px 11px;font-size:.82rem}.nav-icon{display:none}.container{max-width:100%}header{margin-top:0}.card{padding:19px;border-radius:14px}}

.side-nav a{position:relative;border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(0,0,0,.12));box-shadow:5px 5px 10px rgba(0,0,0,.22),-3px -3px 8px rgba(255,255,255,.045),inset 1px 1px 1px rgba(255,255,255,.12);text-shadow:0 1px 1px rgba(0,0,0,.24)}
.side-nav a:hover{transform:translateY(-2px);box-shadow:7px 8px 13px rgba(0,0,0,.25),-2px -2px 7px rgba(255,255,255,.06),inset 1px 1px 1px rgba(255,255,255,.14)}
.side-nav a.active{background:linear-gradient(145deg,#4c8cdb,#2c65ad);border-color:rgba(255,255,255,.28);box-shadow:inset 2px 2px 4px rgba(255,255,255,.2),inset -3px -3px 6px rgba(0,0,0,.18),0 7px 14px rgba(0,0,0,.25)}
button{background:linear-gradient(145deg,#4a87d1,#2e67b1);box-shadow:5px 5px 10px rgba(39,75,120,.18),-3px -3px 8px rgba(255,255,255,.85),inset 1px 1px 1px rgba(255,255,255,.3)}
button:hover{box-shadow:7px 8px 13px rgba(39,75,120,.2),-2px -2px 7px rgba(255,255,255,.9),inset 1px 1px 2px rgba(255,255,255,.28)}
button.secondary{background:linear-gradient(145deg,#f7faff,#dfe8f3);box-shadow:4px 4px 8px rgba(42,64,91,.10),-3px -3px 7px #fff,inset 1px 1px 1px #fff}
.card{box-shadow:9px 10px 24px rgba(31,52,78,.08),-5px -5px 16px rgba(255,255,255,.8);border-color:#e5ebf3}
.page-hidden{display:none!important}

/* MI premium blue-glass visual upgrade */
:root{
  --navy:#071a35;--blue:#2878e8;--blue-dark:#1559b7;--ink:#142b49;
  --muted:#627895;--line:rgba(135,169,211,.28);--bg:#eaf2fc;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 12% 5%,rgba(70,145,255,.20),transparent 34%),
    radial-gradient(ellipse at 92% 18%,rgba(26,104,220,.14),transparent 32%),
    linear-gradient(135deg,#edf5ff 0%,#e5eefb 48%,#f7faff 100%);
  background-attachment:fixed;
}
.sidebar{
  background:linear-gradient(160deg,rgba(5,24,53,.97),rgba(14,55,105,.96) 58%,rgba(20,82,151,.96));
  border-right:1px solid rgba(255,255,255,.18);
  box-shadow:12px 0 42px rgba(8,36,78,.24);
}
.brand strong{letter-spacing:.055em;text-shadow:0 0 18px rgba(108,177,255,.32)}
.brand span{color:#c9dcf7}
.container>header{
  position:relative;overflow:hidden;padding:24px 26px 25px;border:1px solid rgba(255,255,255,.82);
  border-radius:22px;background:linear-gradient(120deg,rgba(255,255,255,.86),rgba(228,240,255,.62));
  box-shadow:0 18px 48px rgba(27,72,132,.11),inset 0 1px 0 #fff;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.container>header:after{
  content:"";position:absolute;width:220px;height:220px;right:-75px;top:-125px;border-radius:50%;
  background:radial-gradient(circle,rgba(63,145,255,.25),rgba(63,145,255,0) 70%);pointer-events:none;
}
h1{
  color:#0b2850;
  background:linear-gradient(100deg,#09234a 8%,#1769ca 55%,#48a0ff 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 8px rgba(35,104,190,.12));
}
.tagline{color:#587493}
.card{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(246,250,255,.78));
  border:1px solid rgba(255,255,255,.94);border-radius:20px;
  box-shadow:0 16px 38px rgba(25,68,124,.10),0 3px 9px rgba(30,73,128,.05),inset 0 1px 0 #fff;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.card:before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg,transparent,#69aaff,#2478df,transparent);opacity:.7;pointer-events:none;
}
.card:hover{transform:translateY(-2px);box-shadow:0 22px 48px rgba(25,68,124,.14),inset 0 1px 0 #fff}
h2{color:#123866}
input,textarea,select{
  background:rgba(255,255,255,.88);border:1px solid rgba(123,157,201,.38);
  border-radius:12px;box-shadow:inset 0 2px 5px rgba(25,65,115,.035);
}
input:focus,textarea:focus,select:focus{
  border-color:#4b98f2;box-shadow:0 0 0 4px rgba(55,137,235,.15),0 5px 16px rgba(42,113,194,.08);
}
button{
  background:linear-gradient(135deg,#55a4ff 0%,#2678df 48%,#1559b7 100%);
  border:1px solid rgba(255,255,255,.35);border-radius:12px;
  box-shadow:0 8px 18px rgba(27,103,197,.22),inset 0 1px 0 rgba(255,255,255,.42),inset 0 -2px 0 rgba(4,40,94,.16);
  text-shadow:0 1px 1px rgba(0,35,85,.22);
}
button:hover{background:linear-gradient(135deg,#70b5ff,#3286ed 48%,#1b65c7);box-shadow:0 12px 24px rgba(27,103,197,.27),inset 0 1px 0 rgba(255,255,255,.5)}
button.secondary{
  color:#174b86;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(220,236,255,.9));
  border:1px solid rgba(104,153,211,.28);box-shadow:0 6px 15px rgba(35,82,139,.09),inset 0 1px 0 #fff;text-shadow:none;
}
.side-nav a{border-radius:12px;backdrop-filter:blur(10px)}
.side-nav a.active{background:linear-gradient(135deg,#58a8ff,#2678df 58%,#1658ad);box-shadow:0 8px 20px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.status,.result,.notice{border-radius:14px}
.result{background:linear-gradient(145deg,rgba(249,252,255,.96),rgba(233,243,255,.86));border-color:rgba(132,169,215,.32)}
.notice{box-shadow:0 8px 22px rgba(125,93,25,.06)}
footer{color:#7187a3}
@media(min-width:1400px){.container{max-width:1160px}.card{padding:29px;margin:22px 0}}
@media(max-width:760px){
  body{background-attachment:scroll}
  .sidebar{background:linear-gradient(145deg,#071a35,#12477f);border-radius:0 0 18px 18px}
  .container>header{padding:19px 17px;border-radius:16px}
  .card{border-radius:16px;padding:19px}
}
@media(prefers-reduced-motion:no-preference){
  .card,button,.side-nav a{transition:transform .22s ease,box-shadow .22s ease,background .22s ease,border-color .22s ease}
}




/* Visible New Project work and save status */
.mi-work-status{display:flex;align-items:center;gap:9px;margin:12px 0 4px;padding:10px 13px;border:1px solid #d5e4f5;border-radius:11px;background:#f3f8ff;color:#31577f;font-size:.88rem;font-weight:650;}
.mi-work-dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:#6b91bc;box-shadow:0 0 0 3px rgba(107,145,188,.14)}
.mi-work-status.is-working{background:#fff8e8;border-color:#f0dfb4;color:#76520b}.mi-work-status.is-working .mi-work-dot{background:#d99a20;animation:miStatusPulse 1s infinite alternate}
.mi-work-status.is-saved{background:#edf9f1;border-color:#ccebd6;color:#176b40}.mi-work-status.is-saved .mi-work-dot{background:#20965b}
.mi-work-status.is-error{background:#fff1f0;border-color:#f1d0cd;color:#a22b25}.mi-work-status.is-error .mi-work-dot{background:#c43e36}
@keyframes miStatusPulse{to{opacity:.35;transform:scale(.78)}}

/* Save project controls: password, file attachment and save action share one row */
.project-save-row{
  display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1fr);
  gap:12px;align-items:end;margin-top:14px;
}
.project-save-field{min-width:0}
.project-save-field label{min-height:2.8em;margin:0 0 7px;display:flex;align-items:flex-end}
.project-save-field input{width:100%;min-width:0;margin:0;min-height:64px;height:64px}
.project-save-field input[type="file"]{padding:10px 12px;font-size:.88rem;min-height:64px;height:64px}
.project-save-action button{width:100%;min-height:64px;height:64px;margin:0;padding:10px 14px}
.project-save-action #saveResult{
  min-height:0;margin:0 0 6px;padding:7px 10px;
  font-size:.82rem;line-height:1.3;border-radius:9px;
}
.project-save-label{display:block;min-height:2.8em;margin-bottom:7px;font-weight:650;font-size:.91rem;color:transparent;user-select:none}
.project-save-notes{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;margin-top:4px}
.project-save-notes p{margin:7px 0 0}
@media(max-width:900px){
  .project-save-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .project-save-action{grid-column:1/-1}
  .project-save-action button{width:100%}
  .project-save-notes{grid-template-columns:1fr}
}
@media(max-width:560px){
  .project-save-row{grid-template-columns:1fr;gap:10px}
  .project-save-action{grid-column:auto}
  .project-save-field label,.project-save-label{min-height:0}
  .project-save-label{display:none}
}

/* Student Access: ChatGPT-style fixed composer with its own scrollable conversation */
body.student-chat-mode{
  height:100vh;height:100dvh;overflow:hidden;
  padding-top:18px;padding-bottom:18px;
}
body.student-chat-mode .container{
  height:100%;min-height:0;display:flex;flex-direction:column;
}
body.student-chat-mode .container>header{
  flex:0 0 auto;margin:0 0 14px;padding-top:15px;padding-bottom:15px;
}
body.student-chat-mode #studentRetrieveArea:not(.page-hidden){
  display:flex;flex:1 1 auto;flex-direction:column;min-height:0;
  margin:0;padding:18px 20px 14px;overflow:hidden;
}
.student-chat-heading{flex:0 0 auto}
.student-chat-heading h2{margin-bottom:5px}
.student-chat-heading p{margin:0}
.student-chat-messages{
  flex:1 1 0;min-height:min(52vh,520px);overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:14px;margin-top:14px;padding:18px;
  border:1px solid rgba(132,169,215,.32);border-radius:16px;
  background:rgba(241,247,255,.78);line-height:1.65;
  scrollbar-gutter:stable;
}
.student-chat-welcome{
  align-self:flex-start;max-width:min(720px,90%);padding:15px 18px;
  border:1px solid rgba(132,169,215,.28);border-radius:16px 16px 16px 5px;
  background:#fff;box-shadow:0 5px 16px rgba(25,68,124,.06);
}
.student-chat-welcome p{margin:7px 0 0}
.student-chat-composer{
  flex:0 0 auto;display:flex;flex-direction:column;gap:10px;
  margin-top:13px;padding:12px;
  border:1px solid rgba(123,157,201,.34);border-radius:17px;
  background:rgba(255,255,255,.94);box-shadow:0 7px 22px rgba(25,68,124,.08);
}
.student-chat-code-row{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;
}
.student-chat-code-row input{min-width:0;margin:0}
.student-chat-code-row button{margin:0;min-width:100px}
.student-sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.student-chat-messages>.status{align-self:flex-start;max-width:90%;margin:0}
.student-chat-messages article{
  flex:0 0 auto;width:100%;margin:0!important;background:#fff;
  box-shadow:0 5px 16px rgba(25,68,124,.05);
}
.student-chat-messages article p{overflow-wrap:anywhere}
@media(max-width:760px){

  }

/* Universal workspace layout: every section stays inside the viewport and scrolls independently */
html{height:100%;overflow:hidden}
body{
  height:100vh;height:100dvh;min-height:0;overflow:hidden;
  display:block;
}
body:not(.student-chat-mode) .container{
  height:calc(100dvh - 60px);min-height:0;
  display:flex;flex-direction:column;overflow:hidden;
}
.container>header{flex:0 0 auto}
.container>.page-panel:not(.page-hidden){
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-gutter:stable;
}
#appArea:not(.hidden){display:contents}
#appArea>.page-panel:not(.page-hidden){
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-gutter:stable;
}
body.student-chat-mode .container{height:100%;min-height:0}
body.student-chat-mode .container>.page-panel:not(.page-hidden){flex:1 1 auto;min-height:0}
body.student-chat-mode #appArea:not(.hidden){display:contents}
@media(max-width:760px){
  body{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;min-height:0;overflow:hidden;
    padding:0 14px 10px;

    margin:0 -14px 10px;width:auto;
  }
  body:not(.student-chat-mode) .container{
    height:auto;flex:1 1 auto;min-height:0;width:100%;
  }
  body.student-chat-mode .container{
    height:auto;flex:1 1 auto;min-height:0;
  }
  .container>.page-panel:not(.page-hidden),
  #appArea>.page-panel:not(.page-hidden){min-height:0}
}
